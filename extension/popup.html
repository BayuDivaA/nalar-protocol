<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NALAR Protocol</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img class="brand-mark-dark" src="icons/n-dark.svg" alt="" />
            <img class="brand-mark-light" src="icons/n-light.svg" alt="" />
          </span>
          <span class="brand-copy">
            <span class="brand-name">NALAR</span>
            <span class="brand-subtitle">SECURITY LAYER</span>
          </span>
        </div>
        <div class="header-controls">
          <button id="themeToggle" class="theme-btn" type="button" aria-label="Switch to light theme" title="Switch to light theme">
            <svg class="theme-icon theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
            <svg class="theme-icon theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A8.7 8.7 0 0 1 10.8 3.5a8.7 8.7 0 1 0 9.7 9.7Z"/></svg>
          </button>
          <button id="toggle" class="status-toggle" type="button" aria-label="Pause NALAR protection" aria-pressed="true">
            <span class="status-track" aria-hidden="true"><span id="statusDot" class="status-dot"></span></span>
            <span id="systemStatus">ACTIVE</span>
          </button>
        </div>
      </header>

      <main class="main">
        <section class="network">
          <div class="network-row">
            <label class="section-label" for="networkSelect">Network</label>
            <div class="network-control">
              <select id="networkSelect" name="network" aria-describedby="networkNote">
                <option value="97">BNB Testnet · 97</option>
                <option value="56">BNB Mainnet · 56</option>
              </select>
            </div>
          </div>
          <p id="networkNote" class="network-note">Checking wallet network…</p>
        </section>

        <section class="security-state" aria-live="polite">
          <div class="security-summary">
            <h1 id="securityHeading">Ready before signing</h1>
            <p id="securityDescription">Transactions are checked before wallet signing.</p>
          </div>
          <div id="networkError" class="network-error" role="alert" hidden>
            <div class="connection-heading">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3v5m6-5v5M7 8h10v3a5 5 0 0 1-10 0V8Zm5 8v5"/></svg>
              <h2 id="networkErrorTitle"></h2>
            </div>
            <p id="networkErrorText"></p>
            <div class="network-actions">
              <button id="networkRetry" type="button">Retry</button>
              <button id="networkTestnet" type="button">Switch to BNB Testnet</button>
            </div>
          </div>
        </section>

        <section class="intent">
          <div class="intent-heading">
            <label class="section-label" for="intent">Your intent</label>
            <div id="siteName" class="site-name" title="Current site">Loading...</div>
          </div>
          <textarea id="intent" rows="3" aria-describedby="privacyNote" placeholder="e.g. Swap 0.001 tBNB for NDEMO"></textarea>
          <div class="intent-actions">
            <button id="clearIntent" class="clear-intent" type="button" aria-label="Remove saved intent for this site">Clear</button>
            <button id="save" class="save" type="button">Save intent</button>
          </div>
          <p id="privacyNote" class="privacy-note">Stored per site; sent with transaction for analysis.</p>
          <div id="message" class="message" role="status" aria-live="polite"></div>
        </section>
      </main>

    </div>
    <script src="config.js"></script>
    <script src="motion-ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
