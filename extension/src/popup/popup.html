<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nalar TxSentry</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <main class="app">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <span class="brand-title">NALAR</span>
          <span class="brand-sub">TxSentry</span>
        </div>
        <div class="status-indicator">
          <span id="statusLabel" class="status-text">ACTIVE</span>
          <span id="statusDot" class="status-dot"></span>
        </div>
      </header>

      <div class="divider"></div>

      <!-- Protection Control -->
      <section class="control-panel">
        <div class="control-header">
          <span class="section-label">PROTECTION</span>
        </div>
        <div class="control-row">
          <div class="control-info">
            <span id="protectionStatus" class="control-status">Firewall active</span>
          </div>
          <button id="toggle" class="toggle-btn active" type="button" aria-label="Toggle protection">
            <span class="toggle-knob"></span>
          </button>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Capabilities List -->
      <section class="capabilities">
        <div class="cap-item">
          <span class="cap-bullet">•</span>
          <span class="cap-text">Transaction analysis</span>
        </div>
        <div class="cap-item">
          <span class="cap-bullet">•</span>
          <span class="cap-text">Scam intelligence</span>
        </div>
        <div class="cap-item">
          <span class="cap-bullet">•</span>
          <span class="cap-text">On-chain evidence</span>
        </div>
      </section>

      <div class="divider"></div>

      <!-- Minimal Explanation -->
      <p class="description">
        Nalar intercepts wallet transactions to evaluate bytecode, simulate execution, and verify on-chain evidence before transmission.
      </p>

      <!-- Footer -->
      <footer class="footer">
        <span>NALAR PROTOCOL</span>
        <span>v1.0.0</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
