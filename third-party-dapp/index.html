<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NFTceria</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: #ffffff;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      main {
        width: min(680px, calc(100% - 32px));
        margin: 0 auto;
        padding: 80px 0;
      }

      .eyebrow {
        color: #71717a;
        font-size: 11px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 0;
        font-size: 48px;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin-top: 18px;
        color: #a1a1aa;
        line-height: 1.7;
      }

      .card {
        margin-top: 40px;
        padding: 24px;
        border: 1px solid #27272a;
        border-radius: 24px;
        background: #09090b;
      }

      .nft {
        padding: 24px;
        border: 1px solid #27272a;
        border-radius: 18px;
        background: #000;
      }

      .nft-title {
        font-size: 20px;
        font-weight: 600;
      }

      .price {
        margin-top: 8px;
        color: #a1a1aa;
        font-size: 14px;
      }

      button {
        width: 100%;
        margin-top: 18px;
        padding: 14px 18px;
        border: 0;
        border-radius: 12px;
        background: #ffffff;
        color: #000000;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #e4e4e7;
      }

      button.secondary {
        background: #18181b;
        color: #ffffff;
        border: 1px solid #3f3f46;
      }

      .status {
        margin-top: 18px;
        padding: 14px;
        border: 1px solid #27272a;
        border-radius: 12px;
        background: #000;
        color: #a1a1aa;
        font-size: 13px;
        line-height: 1.6;
        word-break: break-word;
      }

      .developer {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #27272a;
      }

      .developer label {
        display: block;
        color: #71717a;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }

      select {
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        border: 1px solid #27272a;
        border-radius: 10px;
        background: #000;
        color: #fff;
      }

      .warning {
        margin-top: 10px;
        color: #71717a;
        font-size: 11px;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="eyebrow">NFTceria</div>

      <h1>Mint your NFT.</h1>

      <p class="subtitle">A standalone third-party Web3 dApp. This application does not integrate Nalar Protocol.</p>

      <section class="card">
        <div class="nft">
          <div class="nft-title">NFTceria Genesis</div>

          <div class="price">Price: 0.02 BNB</div>
        </div>

        <button id="connect">Connect Wallet</button>

        <button id="mint">Mint NFT</button>

        <div class="status" id="status">Ready.</div>

        <div class="developer">
          <label for="scenario"> Local test scenario </label>

          <select id="scenario">
            <option value="safe">Normal mint transaction</option>

            <option value="malicious">Malicious approval transaction</option>

            <option value="review">Large payment transaction</option>
          </select>

          <p class="warning">Development-only selector. A real dApp would simply submit its transaction. The Nalar extension does not trust this value.</p>
        </div>
      </section>
    </main>

    <script>
      const DEMO_NFT = "0x4ACCcd7a3d2e2a7c99BE0ea035B40cE03C7A14d1";

      const REVIEW_DEMO = "0xa53Ed009044d8621F0DbbB4FD8f547fBBdB8a721";

      const SAFE_MINT_DATA = "0x6871ee40";

      const MALICIOUS_APPROVAL_DATA = "0x73fbd8db0000000000000000000000003333333333333333333333333333333333333333";

      const REVIEW_DATA = "0x11d895c5";

      const status = document.getElementById("status");

      const scenario = document.getElementById("scenario");

      document.getElementById("connect").addEventListener("click", connectWallet);

      document.getElementById("mint").addEventListener("click", mint);

      async function connectWallet() {
        try {
          const ethereum = getEthereum();

          const accounts = await ethereum.request({
            method: "eth_requestAccounts",
          });

          if (!accounts?.length) {
            throw new Error("No wallet connected.");
          }

          status.textContent = `Connected: ${accounts[0]}`;
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "Wallet connection failed.";
        }
      }

      async function mint() {
        try {
          const ethereum = getEthereum();

          const accounts = await ethereum.request({
            method: "eth_requestAccounts",
          });

          if (!accounts?.length) {
            throw new Error("Connect your wallet first.");
          }

          const selected = scenario.value;

          let transaction;

          if (selected === "safe") {
            transaction = {
              from: accounts[0],

              to: DEMO_NFT,

              value: "0x470de4df820000",

              data: SAFE_MINT_DATA,
            };
          } else if (selected === "malicious") {
            transaction = {
              from: accounts[0],

              to: DEMO_NFT,

              value: "0x0",

              data: MALICIOUS_APPROVAL_DATA,
            };
          } else {
            transaction = {
              from: accounts[0],

              to: REVIEW_DEMO,

              value: "0x853a0d231ce8000",

              data: REVIEW_DATA,
            };
          }

          status.textContent = "dApp is requesting wallet transaction...";

          const hash = await ethereum.request({
            method: "eth_sendTransaction",

            params: [transaction],
          });

          status.textContent = `Transaction submitted: ${String(hash)}`;
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "Transaction rejected.";
        }
      }

      function getEthereum() {
        if (!window.ethereum) {
          throw new Error("No injected wallet provider found.");
        }

        return window.ethereum;
      }
    </script>
  </body>
</html>
